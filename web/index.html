<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Auditorías operativas en talleres de vehículo industrial.">

  <!-- viewport-fit=cover evita la banda blanca bajo la barra de inicio del
       iPhone cuando la app se abre desde la pantalla de inicio. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Sin estas dos etiquetas, iOS abre la app dentro de Safari con su barra
       de direcciones. Con ellas se abre a pantalla completa, como una app. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Auditorías">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <meta name="theme-color" content="#0E4F8B">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Auditorías de taller</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0E4F8B; }
    /* Pantalla de carga propia: el arranque de Flutter web tarda unos
       segundos la primera vez y una pantalla en blanco parece un cuelgue. */
    #arranque {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #0E4F8B; color: #fff; z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #arranque img { width: 76px; height: 76px; }
    #arranque p { margin: 0; font-size: 14px; opacity: .85; }
    .oculto { opacity: 0; pointer-events: none; }

    /* Aviso de version nueva: abajo y centrado, fuera del alcance del pulgar
       para que no se pulse sin querer en mitad de una auditoria. */
    #aviso-version {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
      transform: translateX(-50%);
      z-index: 9998;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px 10px 16px;
      border-radius: 999px;
      background: #0E4F8B; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
    #aviso-version button {
      border: 0; border-radius: 999px; cursor: pointer;
      padding: 7px 14px;
      background: #fff; color: #0E4F8B;
      font: inherit; font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="arranque">
    <img src="icons/Icon-192.png" alt="">
    <p>Cargando auditorías…</p>
  </div>

  <script>
    // Almacenamiento persistente. Sin esto, el navegador puede desalojar
    // IndexedDB cuando le falte espacio, y ahí es donde viven las fotos que
    // aún no se han subido. No todos los navegadores lo conceden, pero
    // pedirlo es gratis y en iOS mejora bastante las probabilidades.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(function (yaEs) {
        if (!yaEs) { navigator.storage.persist(); }
      });
    }

    // Aviso de version nueva. Una app web instalada guarda una copia local
    // para funcionar sin cobertura, asi que al publicar una version nueva
    // seguiria abriendose la vieja hasta que el usuario la cierre del todo.
    // Esto detecta la actualizacion y ofrece aplicarla en el momento.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function (registro) {
        registro.addEventListener('updatefound', function () {
          var entrante = registro.installing;
          if (!entrante) return;
          entrante.addEventListener('statechange', function () {
            // 'installed' con un controlador ya activo significa que hay una
            // version nueva esperando; sin controlador es la primera visita.
            if (entrante.state === 'installed' && navigator.serviceWorker.controller) {
              mostrarAvisoActualizacion();
            }
          });
        });
        // Comprueba al arrancar y luego cada media hora, por si la sesion
        // dura todo el dia dentro del taller.
        registro.update();
        setInterval(function () { registro.update(); }, 30 * 60 * 1000);
      });
    }

    function mostrarAvisoActualizacion() {
      if (document.getElementById('aviso-version')) return;
      var aviso = document.createElement('div');
      aviso.id = 'aviso-version';
      aviso.innerHTML =
        '<span>Hay una versión nueva</span>' +
        '<button type="button">Actualizar</button>';
      aviso.querySelector('button').addEventListener('click', function () {
        window.location.reload();
      });
      document.body.appendChild(aviso);
    }

    window.addEventListener('flutter-first-frame', function () {
      var pantalla = document.getElementById('arranque');
      if (!pantalla) return;
      pantalla.classList.add('oculto');
      setTimeout(function () { pantalla.remove(); }, 350);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
