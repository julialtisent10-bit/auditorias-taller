<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Auditorías operativas en talleres de vehículo industrial.">

  <!-- viewport-fit=cover evita la banda blanca bajo la barra de inicio del
       iPhone cuando la app se abre desde la pantalla de inicio. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Sin estas dos etiquetas, iOS abre la app dentro de Safari con su barra
       de direcciones. Con ellas se abre a pantalla completa, como una app. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Auditorías">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <meta name="theme-color" content="#0E4F8B">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Auditorías de taller</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0E4F8B; }
    /* Pantalla de carga propia: el arranque de Flutter web tarda unos
       segundos la primera vez y una pantalla en blanco parece un cuelgue. */
    #arranque {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #0E4F8B; color: #fff; z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #arranque img { width: 76px; height: 76px; }
    #arranque p { margin: 0; font-size: 14px; opacity: .85; }
    .oculto { opacity: 0; pointer-events: none; }

    /* Aviso de version nueva: abajo y centrado, fuera del alcance del pulgar
       para que no se pulse sin querer en mitad de una auditoria. */
    #aviso-version {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
      transform: translateX(-50%);
      z-index: 10000;   /* por encima de #arranque */
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px 10px 16px;
      border-radius: 999px;
      background: #0E4F8B; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
    #aviso-version button {
      border: 0; border-radius: 999px; cursor: pointer;
      padding: 7px 14px;
      background: #fff; color: #0E4F8B;
      font: inherit; font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="arranque">
    <img src="icons/Icon-192.png" alt="">
    <p>Cargando auditorías…</p>
  </div>

  <script>
    // Almacenamiento persistente. Sin esto, el navegador puede desalojar
    // IndexedDB cuando le falte espacio, y ahí es donde viven las fotos que
    // aún no se han subido. No todos los navegadores lo conceden, pero
    // pedirlo es gratis y en iOS mejora bastante las probabilidades.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(function (yaEs) {
        if (!yaEs) { navigator.storage.persist(); }
      });
    }

    // Registro del service worker propio.
    //
    // Se registra a mano y no a traves de Flutter porque el suyo se limita a
    // desregistrarse y recargar la pagina, dejando la aplicacion inservible
    // sin cobertura. La compilacion usa --pwa-strategy=none justamente para
    // que no genere el suyo y no se peleen por el mismo ambito.
    if ('serviceWorker' in navigator) {
      var recargando = false;

      // Cuando el nuevo toma el relevo hay que recargar para estrenarlo.
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (recargando) return;   // puede dispararse mas de una vez
        recargando = true;
        window.location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (registro) {
          function proponer(trabajador) {
            if (!trabajador) return;
            mostrarAvisoActualizacion(function () {
              trabajador.postMessage('skipWaiting');
            });
          }

          // Puede haber quedado una version esperando de una visita anterior.
          if (registro.waiting && navigator.serviceWorker.controller) {
            proponer(registro.waiting);
          }

          registro.addEventListener('updatefound', function () {
            var entrante = registro.installing;
            if (!entrante) return;
            entrante.addEventListener('statechange', function () {
              // 'installed' con un controlador ya activo significa que hay
              // version nueva lista; sin controlador es la primera visita y
              // no hay nada que avisar.
              if (entrante.state === 'installed' && navigator.serviceWorker.controller) {
                proponer(entrante);
              }
            });
          });

          // Comprueba cada media hora, por si la sesion dura toda la jornada.
          setInterval(function () { registro.update(); }, 30 * 60 * 1000);
        }).catch(function (e) {
          // Sin service worker la aplicacion funciona igual mientras haya
          // red; solo se pierde el poder abrirla sin cobertura. No es motivo
          // para enseñarle un error al auditor.
          console.warn('No se pudo registrar el service worker:', e);
        });
      });
    }

    function mostrarAvisoActualizacion(alPulsar) {
      if (document.getElementById('aviso-version')) return;
      var aviso = document.createElement('div');
      aviso.id = 'aviso-version';
      aviso.innerHTML =
        '<span>Hay una versión nueva</span>' +
        '<button type="button">Actualizar</button>';
      aviso.querySelector('button').addEventListener('click', function () {
        aviso.querySelector('button').disabled = true;
        aviso.querySelector('span').textContent = 'Actualizando…';
        alPulsar();
      });
      document.body.appendChild(aviso);
    }

    var arranqueOk = false;
    window.addEventListener('flutter-first-frame', function () {
      arranqueOk = true;
      var pantalla = document.getElementById('arranque');
      if (!pantalla) return;
      pantalla.classList.add('oculto');
      setTimeout(function () { pantalla.remove(); }, 350);
    });

    setTimeout(function () {
      if (arranqueOk) return;
      var texto = document.querySelector('#arranque p');
      if (!texto) return;
      texto.innerHTML =
        'Está tardando más de lo normal.<br>' +
        '<button type="button" id="btn-recuperar" style="' +
        'margin-top:12px;border:0;border-radius:999px;padding:8px 16px;' +
        'background:#fff;color:#0E4F8B;font:inherit;font-weight:600;' +
        'cursor:pointer;">Volver a cargar</button>';
      document.getElementById('btn-recuperar').addEventListener('click', function () {
        this.disabled = true;
        this.textContent = 'Recargando…';
        // Recuperacion real: se borra todo lo guardado (cache y service
        // worker) y se recarga desde cero. Un simple reload no basta si lo
        // que esta roto es precisamente lo que hay guardado.
        Promise.all([
          'caches' in window ? caches.keys().then(function (n) {
            return Promise.all(n.map(function (k) { return caches.delete(k); }));
          }) : Promise.resolve(),
          'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations()
            .then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }) : Promise.resolve(),
        ]).finally(function () {
          window.location.reload();
        });
      });
    }, 6000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
